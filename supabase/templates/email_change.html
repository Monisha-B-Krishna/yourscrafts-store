<!doctype html>
<html lang="en">
  <body style="margin:0;padding:0;background:#FFF9F4;font-family:Inter,Arial,Helvetica,sans-serif;color:#111111;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#FFF9F4;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:20px;padding:36px 28px;">
            <tr>
              <td style="font-family:Georgia,'Times New Roman',serif;font-size:22px;padding-bottom:24px;">Yours Crafts Woman</td>
            </tr>
            <tr>
              <td style="font-family:Georgia,'Times New Roman',serif;font-size:26px;line-height:1.25;padding-bottom:12px;">Confirm your new email</td>
            </tr>
            <tr>
              <td style="font-size:15px;line-height:1.6;color:#4a4a4a;padding-bottom:28px;">Tap the button below to confirm {{ .NewEmail }} as the new email for your Yours Crafts Woman account.</td>
            </tr>
            <tr>
              <td>
                <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email_change&amp;next=/account" style="display:inline-block;background:#F4A27A;color:#111111;text-decoration:none;font-weight:600;font-size:15px;padding:14px 28px;border-radius:999px;">Confirm new email</a>
              </td>
            </tr>
            <tr>
              <td style="font-size:13px;line-height:1.6;color:#6B6B6B;padding-top:28px;">This link works once and expires in 1 hour. If you didn't ask for it, you can ignore this email.</td>
            </tr>
          </table>
          <p style="font-size:12px;color:#6B6B6B;margin-top:20px;">Handmade with love · @yours.craftswoman</p>
        </td>
      </tr>
    </table>
  </body>
</html>
